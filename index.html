<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in Express — Self Check-in Digital | Praia Digital</title><meta name="description" content="Gere em segundos uma mensagem completa de self check-in para enviar ao hóspede no WhatsApp."><style>body{font-family:system-ui,sans-serif;background:linear-gradient(160deg,#eef0fb,#f7f3ea);margin:0;padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #4a4e8c22}h1{color:#3d4291;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select,textarea{width:100%;padding:.6rem;border:2px solid #dde0f0;border-radius:10px;font-size:1rem;box-sizing:border-box}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#4a4e8c;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#out{margin-top:1.4rem;display:none}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#4a4e8c;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/guia-hospede">Guia do Hóspede</a> · <a href="https://praia.digital/manual-hospede">Manual do Hóspede</a> · <a href="https://praia.digital/concierge-digital">Concierge Digital</a></nav><div class="card"><h1>🔑 Check-in Express</h1><p>Mensagem pronta de self check-in para WhatsApp, em 30 segundos.</p><label>Nome do imóvel</label><input id="n" value="Apê Vista Mar"><label>Horário de check-in</label><input id="h" value="15h"><label>Tipo de acesso</label><select id="a"><option>Portaria 24h (retirar chave)</option><option>Fechadura eletrônica (código)</option><option>Lockbox na porta (senha)</option><option>Encontro presencial</option></select><label>Código/senha (se houver)</label><input id="c" placeholder="ex: 4821#"><label>Wi-Fi (rede / senha)</label><input id="w" placeholder="VistaMar_5G / praia2026"><label>Contato de emergência</label><input id="e" placeholder="(13) 99999-0000"><button onclick="gerar()">Gerar mensagem</button><div id="out"><label>Mensagem pronta</label><textarea id="t" rows="12"></textarea><button onclick="copiar()">📋 Copiar</button></div></div><script>function gerar(){const g=id=>document.getElementById(id).value;document.getElementById('out').style.display='block';document.getElementById('t').value=`Olá! Seja bem-vindo(a) ao ${g('n')} 🏖️\n\n🕒 Check-in a partir das ${g('h')}\n🚪 Acesso: ${g('a')}${g('c')?'\n🔢 Código/senha: '+g('c'):''}\n📶 Wi-Fi: ${g('w')}\n\nEm caso de qualquer imprevisto: ${g('e')}\n\nBoas férias! 🌊`;}function copiar(){const t=document.getElementById('t');t.select();document.execCommand('copy');alert('Copiado!')}</script></body></html>
